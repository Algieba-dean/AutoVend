[project]
name = "autovend"
version = "2.0.0"
description = "Intelligent automotive sales assistant — hybrid retrieval (structured filter + dense + sparse) with a stateful sales agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # LlamaIndex core
    "llama-index-core>=0.11.0",
    "llama-index-llms-openai-like>=0.2.0",
    "llama-index-embeddings-huggingface>=0.3.0",
    "llama-index-vector-stores-chroma>=0.2.0",
    # Vector database
    "chromadb>=0.5.0",
    # Embeddings - BGE-M3 support
    "sentence-transformers>=2.2.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    # Sparse retrieval (BM25 + Chinese tokenization)
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    # Rule-based PII detection and masking
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    # Voice
    "faster-whisper>=1.0.0",
    "edge-tts>=6.1.0",
    "websockets>=12.0",
    "soundfile>=0.12.0",
    # Data processing
    "toml>=0.10.2",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    # Configuration
    "python-dotenv>=1.0.0",
    # Logging
    "rich>=13.0.0",
    # CLI
    "click>=8.0.0",
    "typer>=0.9.0",
    "requests>=2.33.1",
    "groq>=1.1.2",
    # Observability
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "playwright>=1.62.0",
    "beautifulsoup4>=4.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "psutil>=5.9.0",
    "ruff>=0.8.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]
# LLM-judged RAG evaluation — only needed for the scheduled/manual eval workflow,
# never for CI's deterministic gate.
eval = [
    "ragas>=0.4.3",
    "datasets>=4.0.0",
    "langchain-openai>=0.2.0",
    # ragas 0.4.3 declares langchain-community unpinned but imports
    # `langchain_community.chat_models.vertexai`, which 0.4.x removed.
    "langchain-community<0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: loads the embedding model or the vector index (deselect with '-m \"not slow\"')",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Long prompt strings must stay on one line to keep the prompt text readable.
"src/agent/extractors/*.py" = ["E501"]
"src/agent/response_generator.py" = ["E501"]
"src/llm/mock_llm.py" = ["E501"]
"src/models/query.py" = ["E501"]
"src/filter/label_registry.py" = ["E501"]
"tests/kpi_report.py" = ["E501"]
"tests/performance/*.py" = ["E501"]
# Golden-set specs read best with each query's ground-truth predicate on one
# line next to the query it belongs to.
"src/eval/golden_set.py" = ["E501"]
# CLI entry points bootstrap sys.path before importing src.*, so imports
# legitimately follow that call.
"src/main.py" = ["E402"]
"src/test_llm.py" = ["E402"]
# Benchmarks assign results to force evaluation before timing the call.
"tests/test_performance_metrics.py" = ["E402", "F841"]

[tool.coverage.run]
source = ["src", "backend"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
native-tls = true
