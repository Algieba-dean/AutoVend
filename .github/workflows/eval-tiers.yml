name: Evaluation Tiers (nightly / release)

# Three tiers, split by what each can afford to be.
#
#   PR       — ci.yml `eval-gate`. Deterministic retrieval metrics, no LLM, a
#              few seconds, blocking. A judge here would make merges flaky for
#              reasons unrelated to the change under review.
#   Nightly  — this file, `nightly` job. Full golden set through the LLM judge
#              via the async queue. Non-blocking: it reports and trends.
#   Release  — this file, `release-gate` job. Judge-vs-human alignment on the
#              reviewed sample. Blocking, because shipping a judge that no
#              longer agrees with humans silently invalidates every downstream
#              number the nightly tier produces.
#
# Only the release tier blocks on an LLM, and it blocks on the judge's
# *calibration* rather than on any single stochastic verdict.

on:
  schedule:
    # 03:00 UTC (11:00 Beijing), after the Monday RAGAS run has finished.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "Which tier to run"
        required: true
        default: "nightly"
        type: choice
        options: [nightly, release]
      pairs:
        description: "Judge case pairs (nightly)"
        required: false
        default: "12"
        type: string
  release:
    types: [created]

env:
  PYTHON_VERSION: "3.12"
  EMBEDDING_DEVICE: cpu

concurrency:
  group: eval-tiers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Nightly: full judged run, reports only ──────────────────
  nightly:
    name: "Nightly — judged evaluation"
    if: github.event_name == 'schedule' || inputs.tier == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check for LLM credentials
        id: creds
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::LLM_API_KEY not set — skipping judged evaluation."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.creds.outputs.available == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        if: steps.creds.outputs.available == 'true'
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.creds.outputs.available == 'true'
        run: uv sync --all-extras

      - name: Cache embedding model
        if: steps.creds.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-bge-m3-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-hf-bge-m3-

      - name: Build indices
        if: steps.creds.outputs.available == 'true'
        run: uv run python -m src.main build --batch-size 50

      # Runs through the rate-limited async queue, so a shared key cannot be
      # exhausted by this job alone.
      - name: Judge A/B across modes
        if: steps.creds.outputs.available == 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'llama-3.3-70b-versatile' }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.groq.com/openai/v1' }}
        run: |
          uv run python -m src.eval.judge_ab \
            --pairs "${{ inputs.pairs || '12' }}" \
            --difficulty subtle \
            --modes naive cot structured \
            | tee judge-ab.txt

      - name: Publish to the job summary
        if: always() && steps.creds.outputs.available == 'true'
        run: |
          {
            echo "## Nightly — LLM judge A/B"
            echo ""
            echo '```'
            cat judge-ab.txt 2>/dev/null || echo "(no report produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always() && steps.creds.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-evaluation
          path: |
            judge-ab.txt
            evaluation/results/judge_ab*.json
          retention-days: 90

  # ── Release: judge-vs-human alignment, blocking ─────────────
  release-gate:
    name: "Release — judge alignment gate"
    if: github.event_name == 'release' || inputs.tier == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      # Reads the reviewed sample committed under evaluation/review/. The gate
      # fails on a missing or unreviewed file rather than passing by default:
      # "nobody reviewed anything" must not read the same as "reviewers
      # agreed", which is exactly what a skip-on-missing would do.
      - name: Judge-vs-human alignment
        run: |
          uv run python -m src.eval.alignment_gate \
            --review evaluation/review/latest.jsonl \
            | tee alignment.txt

      - name: Publish to the job summary
        if: always()
        run: |
          {
            echo "## Release gate — judge/human alignment"
            echo ""
            echo '```'
            cat alignment.txt 2>/dev/null || echo "(no report produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-alignment
          path: |
            alignment.txt
            evaluation/results/alignment_*.json
          retention-days: 365
