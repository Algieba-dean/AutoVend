name: Performance Tests

on:
  push:
    branches: [ main, develop, feature/from_zero ]  # 添加您的分支
  pull_request:
    branches: [ main, develop ]             # PR到main和develop时触发
  schedule:
    # 每天UTC 02:00运行性能测试 (北京时间10:00)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of performance test to run'
        required: false
        default: 'all'
        type: choice
        options:
        - all
        - embedding
        - retrieval
        - concurrent
        - memory
        - accuracy

jobs:
  performance-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"
        
    - name: Install dependencies
      run: |
        uv sync --dev
        
    - name: Cache model files
      uses: actions/cache@v3
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-huggingface-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-huggingface-
          
    - name: Build index (if needed)
      run: |
        # 设置设备为CPU（GitHub Actions没有GPU）
        echo "EMBEDDING_DEVICE=cpu" >> $GITHUB_ENV
        
        # 检查索引是否存在，如果不存在则构建
        if [ ! -d "data/chroma_db" ] || [ -z "$(ls -A data/chroma_db)" ]; then
          echo "Building index..."
          uv run python src/main.py build --batch-size 50
        else
          echo "Index already exists, skipping build."
        fi
        
    - name: Run performance tests
      run: |
        export EMBEDDING_DEVICE=cpu
        python tests/test_performance_metrics.py > performance_results.txt 2>&1
        
    - name: Parse performance results
      id: parse-results
      run: |
        # 解析性能测试结果
        python << 'EOF'
        import re
        import json
        
        # 读取性能测试结果
        with open('performance_results.txt', 'r') as f:
            content = f.read()
        
        # 提取关键指标
        metrics = {}
        
        # 响应时间
        response_match = re.search(r'Average Retrieval Time: ([\d.]+)s', content)
        if response_match:
            metrics['avg_retrieval_time'] = float(response_match.group(1))
            
        # QPS
        qps_match = re.search(r'QPS: ([\d.]+)', content)
        if qps_match:
            metrics['qps'] = float(qps_match.group(1))
            
        # 成功率
        success_match = re.search(r'Success Rate: ([\d.]+)', content)
        if success_match:
            metrics['success_rate'] = float(success_match.group(1))
        
        # 准确性指标
        overall_match = re.search(r'Overall Accuracy: ([\d.]+)%', content)
        if overall_match:
            metrics['overall_accuracy'] = float(overall_match.group(1))
            
        category_match = re.search(r'Category Accuracy: ([\d.]+)%', content)
        if category_match:
            metrics['category_accuracy'] = float(category_match.group(1))
            
        brand_match = re.search(r'Brand Accuracy: ([\d.]+)%', content)
        if brand_match:
            metrics['brand_accuracy'] = float(brand_match.group(1))
            
        powertrain_match = re.search(r'Powertrain Accuracy: ([\d.]+)%', content)
        if powertrain_match:
            metrics['powertrain_accuracy'] = float(powertrain_match.group(1))
            
        origin_match = re.search(r'Origin Accuracy: ([\d.]+)%', content)
        if origin_match:
            metrics['origin_accuracy'] = float(origin_match.group(1))
            
        price_match = re.search(r'Price Accuracy: ([\d.]+)%', content)
        if price_match:
            metrics['price_accuracy'] = float(price_match.group(1))
        
        # 测试覆盖率信息
        coverage_match = re.search(r'Total Tests: (\d+)', content)
        if coverage_match:
            metrics['total_tests'] = int(coverage_match.group(1))
            
        concurrent_response_match = re.search(r'并发响应时间: ([\d.]+)s', content)
        if concurrent_response_match:
            metrics['concurrent_response_time'] = float(concurrent_response_match.group(1))
        
        # 内存使用
        memory_match = re.search(r'峰值内存: ([\d.]+)MB', content)
        if memory_match:
            metrics['peak_memory_mb'] = float(memory_match.group(1))
        
        # 准确性指标
        category_match = re.search(r'类别准确率: ([\d.]+)%', content)
        if category_match:
            metrics['category_accuracy'] = float(category_match.group(1))
            
        brand_match = re.search(r'品牌准确率: ([\d.]+)%', content)
        if brand_match:
            metrics['brand_accuracy'] = float(brand_match.group(1))
        
        # 输出JSON格式供后续步骤使用
        with open('metrics.json', 'w') as f:
            json.dump(metrics, f, indent=2)
        
        # 输出到GitHub Actions
        print("::set-output name=metrics::" + json.dumps(metrics))
        EOF
        
    - name: Performance Check
      run: |
        python << 'EOF'
        import json
        import sys
        
        # 读取指标
        with open('metrics.json', 'r') as f:
            metrics = json.load(f)
        
        print("📊 Performance Metrics Summary:")
        print("=" * 50)
        
        # 检查关键指标是否在可接受范围内
        warnings = []
        errors = []
        
        # 响应时间检查
        if 'avg_retrieval_time' in metrics:
            retrieval_time = metrics['avg_retrieval_time']
            print(f"🔍 Average Retrieval Time: {retrieval_time:.3f}s")
            if retrieval_time > 0.1:
                errors.append(f"Retrieval time too high: {retrieval_time:.3f}s > 0.1s")
            elif retrieval_time > 0.05:
                warnings.append(f"Retrieval time elevated: {retrieval_time:.3f}s > 0.05s")
        
        # QPS检查
        if 'qps' in metrics:
            qps = metrics['qps']
            print(f"⚡ QPS: {qps:.1f}")
            if qps < 10:
                errors.append(f"QPS too low: {qps:.1f} < 10")
            elif qps < 20:
                warnings.append(f"QPS could be improved: {qps:.1f} < 20")
        
        # 内存使用检查
        if 'peak_memory_mb' in metrics:
            memory = metrics['peak_memory_mb']
            print(f"💾 Peak Memory: {memory:.1f}MB")
            if memory > 3000:
                errors.append(f"Memory usage too high: {memory:.1f}MB > 3000MB")
            elif memory > 2500:
                warnings.append(f"Memory usage elevated: {memory:.1f}MB > 2500MB")
        
        # Accuracy check (overall supported features)
        if 'overall_accuracy' in metrics:
            accuracy = metrics['overall_accuracy']
            print(f"Overall Accuracy: {accuracy:.1f}%")
            if accuracy < 70:
                errors.append(f"Overall accuracy too low: {accuracy:.1f}% < 70%")
            elif accuracy < 80:
                warnings.append(f"Overall accuracy could be improved: {accuracy:.1f}% < 80%")
        
        # Individual accuracy checks
        if 'category_accuracy' in metrics:
            accuracy = metrics['category_accuracy']
            print(f"Category Accuracy: {accuracy:.1f}%")
        
        if 'brand_accuracy' in metrics:
            accuracy = metrics['brand_accuracy']
            print(f"Brand Accuracy: {accuracy:.1f}%")
        
        if 'powertrain_accuracy' in metrics:
            accuracy = metrics['powertrain_accuracy']
            print(f"Powertrain Accuracy: {accuracy:.1f}%")
        
        print("=" * 50)
        
        # 输出警告和错误
        if warnings:
            print("⚠️  Warnings:")
            for warning in warnings:
                print(f"  - {warning}")
        
        if errors:
            print("❌ Errors:")
            for error in errors:
                print(f"  - {error}")
            sys.exit(1)
        else:
            print("✅ All performance checks passed!")
        EOF
        
    - name: Generate Performance Report
      run: |
        python << 'EOF'
        import json
        from datetime import datetime
        
        # 读取指标
        with open('metrics.json', 'r') as f:
            metrics = json.load(f)
        
        # 生成性能报告
        generated_time = datetime.now().strftime('%Y-%m-%d %H:%M:%S UTC')
        commit_sha = "${{ github.sha }}"
        branch_name = "${{ github.ref_name }}"
        
        report = (
            f"# AutoVend Hybrid Pipeline Performance Report\n\n"
            f"**Generated:** {generated_time}  \n"
            f"**Commit:** {commit_sha}  \n"
            f"**Branch:** {branch_name}\n\n"
            f"## Performance Metrics\n\n"
            f"### Retrieval Performance\n"
            f"- Average Response Time: {metrics.get('avg_retrieval_time', 'N/A')}s\n"
            f"- Success Rate: {metrics.get('success_rate', 'N/A')}%\n"
            f"- QPS: {metrics.get('qps', 'N/A')}\n\n"
            f"## Accuracy Metrics (Supported Features Only)\n\n"
            f"- **Overall Accuracy**: {metrics.get('overall_accuracy', 'N/A')}%\n"
            f"- Category Accuracy: {metrics.get('category_accuracy', 'N/A')}%\n"
            f"- Brand Accuracy: {metrics.get('brand_accuracy', 'N/A')}%\n"
            f"- Powertrain Accuracy: {metrics.get('powertrain_accuracy', 'N/A')}%\n"
            f"- Origin Accuracy: {metrics.get('origin_accuracy', 'N/A')}%\n"
            f"- Price Accuracy: {metrics.get('price_accuracy', 'N/A')}%\n\n"
            f"## Test Coverage\n\n"
            f"- Total Tests: {metrics.get('total_tests', 'N/A')}\n"
            f"- Supported Features Only: YES\n"
            f"- Realistic Assessment: YES\n\n"
            f"## Notes\n\n"
            f"This report reflects only supported features of the hybrid retrieval system.\n"
            f"Exclusion queries and complex multi-constraint queries are not yet supported.\n"
            f"## 🔍 Recommendations\n\n"
            f"*Performance optimization recommendations will be added based on test results.*\n"
        )
        
        with open('performance_report.md', 'w') as f:
            f.write(report)
        
        print("Performance report generated!")
        EOF
        
    - name: Upload Performance Results
      uses: actions/upload-artifact@v4
      with:
        name: performance-results-${{ github.run_number }}
        path: |
          performance_results.txt
          metrics.json
          performance_report.md
        retention-days: 30
        
    - name: Comment PR with Results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          
          try {
            const metrics = JSON.parse(fs.readFileSync('metrics.json', 'utf8'));
            const report = fs.readFileSync('performance_report.md', 'utf8');
            
            const comment = `## 🚀 Performance Test Results
            
            ${report}
            
            ---
            *Results generated by GitHub Actions workflow*
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('Error creating comment:', error);
    - name: Update Performance Badge (if on main)
      if: github.ref == 'refs/heads/main'
      run: |
        python << 'EOF'
        import json
        
        # Read metrics
        with open('metrics.json', 'r') as f:
            metrics = json.load(f)
        
        # Generate badge URLs
        response_time = metrics.get('avg_retrieval_time', 0)
        qps = metrics.get('qps', 0)
        accuracy = metrics.get('overall_accuracy', 0)
        
        # Determine colors
        def get_color(value, good_threshold, warning_threshold):
            if value >= good_threshold:
                return 'brightgreen'
            elif value >= warning_threshold:
                return 'green'
            elif value >= warning_threshold * 0.7:
                return 'yellow'
            else:
                return 'red'
        
        response_color = get_color(1/response_time if response_time > 0 else 0, 20, 10)  # Invert for QPS-like metric
        qps_color = get_color(qps, 20, 10)
        accuracy_color = get_color(accuracy, 90, 70)
        
        # Generate badge data
        badges = {
            'response_time': {
                'label': 'Response Time',
                'message': f'{response_time:.3f}s',
                'color': response_color
            },
            'qps': {
                'label': 'QPS',
                'message': f'{qps:.0f}',
                'color': qps_color
            },
            'accuracy': {
                'label': 'Accuracy',
                'message': f'{accuracy:.0f}%',
                'color': accuracy_color
            }
        }
        
        # Save badges
        with open('performance_badges.json', 'w') as f:
            json.dump(badges, f, indent=2)
        
        # Generate badge URLs for README
        print("Generated badge URLs:")
        for key, badge in badges.items():
            url = f"https://img.shields.io/badge/{badge['label'].replace(' ', '%20')}-{badge['message'].replace(' ', '%20')}-{badge['color']}"
            print(f"[![{badge['label']}]({url})]({url})")
        
        print("Performance badges updated!")
        EOF

  # 性能回归测试
  regression-test:
    runs-on: ubuntu-latest
    needs: performance-tests
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install uv
      uses: astral-sh/setup-uv@v2
      
    - name: Install dependencies
      run: uv sync --dev
      
    - name: Compare with baseline
      run: |
        echo "Performance regression comparison would be implemented here"
        echo "This would compare current branch performance with main branch"

  # 夜间压力测试
  stress-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install uv
      uses: astral-sh/setup-uv@v2
      
    - name: Install dependencies
      run: uv sync --dev
      
    - name: Run stress tests
      run: |
        echo "Running extended stress tests..."
        uv run python tests/test_performance_metrics.py
        
    - name: Generate stress test report
      run: |
        echo "Generating comprehensive stress test report..."
