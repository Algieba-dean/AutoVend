name: CI

on:
  push:
    branches: [master, main, develop, "feature/**"]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  # No GPU on GitHub runners; BGE-M3 would otherwise try to initialise CUDA.
  EMBEDDING_DEVICE: cpu

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ────────────────────────────────────────────────────
  lint:
    name: "Lint (Ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff check
        run: uv run ruff check src/ backend/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ backend/ tests/

  # ── Unit + Integration Tests ────────────────────────────────
  test:
    name: "Tests + Coverage"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      # `slow` tests need the embedding model and the vector index; they run in
      # the eval-gate job below, which pays for the model cache once.
      - name: Run tests with coverage
        run: |
          uv run pytest tests/ \
            -m "not slow" \
            --ignore=tests/performance \
            --ignore=tests/test_performance_metrics.py \
            --ignore=tests/test_retrieval_comprehensive.py \
            --cov=src --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml \
            -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            test-results.xml

  # ── Architecture guard ──────────────────────────────────────
  architecture:
    name: "Architecture Isolation"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      # src/agent must stay free of FastAPI, ChromaDB and backend imports, or
      # the agent stops being independently testable and reusable.
      - name: Verify agent has no backend dependencies
        run: uv run pytest tests/test_agent_isolation.py -v

      - name: Check for circular imports
        run: |
          uv run python -c "
          import src.agent.sales_agent
          import src.agent.schemas
          import src.agent.stages
          import src.agent.memory
          import src.agent.response_generator
          import src.agent.extractors.base
          import src.agent.extractors.profile_extractor
          import src.agent.extractors.needs_extractor
          import src.agent.extractors.implicit_deductor
          import src.agent.extractors.reservation_extractor
          print('All agent modules imported successfully — no circular imports.')
          "

  # ── Retrieval quality gate ──────────────────────────────────
  eval-gate:
    name: "Retrieval Quality Gate"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      # BGE-M3 is ~2GB; without this every run re-downloads it.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-bge-m3-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-hf-bge-m3-

      # data/ is gitignored, so both indices are rebuilt from the TOML source.
      # That also exercises the ingestion path on every run.
      - name: Build indices
        run: uv run python -m src.main build --batch-size 50

      # No LLM key is configured, and none is needed: this gate is purely
      # deterministic. LLM-judged metrics run in rag-eval.yml and never block.
      - name: Retrieval quality gate
        run: uv run python -m src.eval.gate

      - name: Full A/B comparison
        if: always()
        run: |
          uv run python -m src.eval.runner \
            --systems filter bm25 dense hybrid fusion \
            --markdown evaluation/comparison.md

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation
          path: |
            evaluation/comparison.md
            evaluation/results/
          retention-days: 90

      - name: Publish comparison to the job summary
        if: always()
        run: cat evaluation/comparison.md >> "$GITHUB_STEP_SUMMARY"

  # ── KPI report ──────────────────────────────────────────────
  kpi-report:
    name: "KPI Metrics Report"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run KPI tests and generate report
        run: uv run python tests/kpi_report.py | tee kpi-report.md

      - name: Upload KPI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kpi-report
          path: kpi-report.md
          retention-days: 90
